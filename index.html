<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#070707">

<title>NENE AI</title>
<style>
:root{
  --bg:#070707; --panel:#11100e; --panel2:#171512; --gold:#f4c95d;
  --gold2:#ffe7a1; --cream:#fff8e8; --muted:#aaa49a; --line:#3b2d13;
  --danger:#d98f8f; --success:#bde6a7;
}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% -10%,#251b08 0,#070707 38%);color:var(--cream);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea,select{font:inherit} button{cursor:pointer}
[hidden]{display:none!important}
.app{width:100%;max-width:1100px;min-height:100vh;margin:auto;background:linear-gradient(180deg,#080808,#0b0a09 70%,#080808);position:relative;overflow:hidden}
header{position:sticky;top:0;z-index:10;padding:14px 16px 12px;border-bottom:1px solid #5a4318;background:rgba(7,7,7,.93);backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px}
.logo{font-family:Georgia,serif;font-size:25px;letter-spacing:1px;font-weight:700;color:var(--gold2)} .tag{font-size:9px;color:var(--gold);margin-top:1px}
.avatar{margin-left:auto;width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid var(--gold)}
.credits{text-decoration:none;text-align:center;font-size:11px;border:1px solid #72571d;border-radius:22px;padding:7px 10px;color:var(--gold2);background:#0d0b07}.credits b{font-size:14px}
.auth-header-btn{border:1px solid #72571d;border-radius:999px;padding:8px 10px;background:#17130c;color:var(--gold2);font-size:11px;font-weight:700;white-space:nowrap}
main{padding:18px 16px calc(120px + env(safe-area-inset-bottom, 0px));scroll-padding-bottom:calc(120px + env(safe-area-inset-bottom, 0px))}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:1.8px;text-transform:uppercase}
h1{font-family:Georgia,serif;font-size:33px;margin:5px 0 8px}.subtitle{color:var(--muted);line-height:1.5;font-size:14px}
.hero{padding:20px;border:1px solid #594418;border-radius:24px;background:linear-gradient(135deg,#17120a,#0e0d0b);box-shadow:0 0 35px rgba(244,201,93,.08);margin-bottom:18px}
.hero-row{display:flex;align-items:center;gap:15px}.hero img{width:88px;height:88px;border-radius:22px;object-fit:cover;filter:brightness(.72) contrast(1.05);border:1px solid #8b6820}
.section-title{font-family:Georgia,serif;font-size:20px;margin:20px 0 11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid var(--line);background:linear-gradient(145deg,#16130f,#0f0f0f);border-radius:17px;padding:15px;text-align:left;color:var(--cream);transition:.2s}
.card:hover{border-color:#9b7626;transform:translateY(-1px)} .card .icon{font-size:24px}.card b{display:block;margin:8px 0 4px}.card small{color:var(--muted);line-height:1.35}
.wide{grid-column:1/-1}.gold{border-color:#89671e;background:linear-gradient(135deg,#4b3510,#c6942f 48%,#f1cb6b);color:#1a1306;font-weight:800}
.btn{width:100%;border:1px solid #85641f;border-radius:16px;padding:13px;background:#17130c;color:var(--gold2);font-weight:700}.btn.gold{background:linear-gradient(135deg,#8f6418,#f4c95d);color:#151006}
.row{display:flex;gap:8px}.row>*{flex:1}
.field, textarea, select{width:100%;background:#0c0c0c;color:var(--cream);border:1px solid #493716;border-radius:14px;padding:13px;outline:none}.field:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:130px;resize:vertical}.label{font-size:12px;color:#cfc8bb;margin:0 0 7px}.block{margin:13px 0}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #493716;border-radius:999px;padding:9px 11px;background:#0f0e0c;color:#cfc8bb;font-size:12px}.chip.active{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 14px rgba(244,201,93,.12)}
.preview{height:210px;border:1px dashed #72571d;border-radius:18px;background:linear-gradient(135deg,#17120a,#090909);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover;filter:brightness(.65)}
.upload{position:relative}.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(1100px,100%);height:calc(76px + env(safe-area-inset-bottom, 0px));padding-bottom:env(safe-area-inset-bottom, 0px);background:rgba(7,7,7,.96);border-top:1px solid #4d3b17;display:grid;grid-template-columns:repeat(4,1fr);z-index:20}
.nav{border:0;background:none;color:#aaa49a;font-size:10px}.nav span{display:block;font-size:20px;margin-bottom:3px}.nav.active{color:var(--gold2)} .create{font-size:28px;color:var(--gold);text-shadow:0 0 14px rgba(244,201,93,.5)}
.back{border:0;background:none;color:var(--gold);font-size:22px}.toolhead{display:flex;align-items:center;gap:8px;margin-bottom:15px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#20180b;border:1px solid #644a17;color:var(--gold);font-size:10px}
.list{display:flex;flex-direction:column;gap:10px}.creation{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:#11100e}.thumb{width:72px;height:72px;border-radius:12px;background:linear-gradient(135deg,#33250d,#161616);display:grid;place-items:center;font-size:27px}.creation small{color:var(--muted)}
.profile-card{padding:20px;border:1px solid var(--line);border-radius:22px;text-align:center;background:#11100e}.profile-big{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);filter:brightness(.7)}
.notice{padding:12px;border-radius:14px;border:1px solid #574217;background:#17130b;color:#d7c28f;font-size:12px;line-height:1.45}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;display:none;align-items:center;justify-content:center;padding:22px}.modal.show{display:flex}.modalbox{max-height:calc(100vh - 44px);max-height:calc(100dvh - 44px);overflow-y:auto;width:min(390px,100%);border:1px solid #795b1c;border-radius:24px;background:#11100e;padding:22px;box-shadow:0 0 50px rgba(244,201,93,.15)}
.spinner{width:52px;height:52px;border-radius:50%;border:3px solid #3b2d13;border-top-color:var(--gold);animation:spin 1s linear infinite;margin:8px auto 18px}@keyframes spin{to{transform:rotate(360deg)}}

.star{background:none;border:0;color:#4a3a1a;cursor:pointer;padding:0;line-height:1}
.star.active{color:var(--gold2)}
.toast{position:fixed;top:85px;left:50%;transform:translateX(-50%);background:#19150d;border:1px solid #76591b;color:var(--gold2);padding:10px 14px;border-radius:999px;z-index:60;font-size:12px;display:none}.toast.show{display:block}
hr{border:0;border-top:1px solid #2d2516;margin:18px 0}
@media(min-width:700px){body{padding:20px}.app{border-radius:28px;box-shadow:0 0 70px rgba(0,0,0,.55)}}

/* NENE AI Complete Studio additions */
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tool-mini{border:1px solid var(--line);background:#11100e;border-radius:15px;padding:13px;text-align:left;color:var(--cream)}
.tool-mini b{display:block;margin:5px 0 3px;font-size:13px}.tool-mini small{color:var(--muted);line-height:1.3}
.timeline{display:flex;gap:7px;overflow:auto;padding:4px 0 10px}
.scene{min-width:112px;height:78px;border:1px solid #574217;border-radius:12px;background:linear-gradient(135deg,#2a1d08,#111);display:grid;place-items:center;color:#cfc8bb;font-size:11px}
.progress{height:8px;border-radius:99px;background:#201a10;overflow:hidden;border:1px solid #493716}
.progress i{display:block;width:68%;height:100%;background:linear-gradient(90deg,#8f6418,#f4c95d)}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpi .notice{text-align:center}
.toggle{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);padding:12px;border-radius:14px;background:#11100e}
.switch{width:46px;height:25px;border-radius:20px;background:#392c17;padding:3px}.switch i{display:block;width:19px;height:19px;border-radius:50%;background:#9b7a32}.switch.on{background:#a8751d}.switch.on i{margin-left:21px;background:#fff2bf}

</style>




<style id="nene-backend-bridge-css">
.nene-live-status{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:#aaa}
.nene-live-dot{width:8px;height:8px;border-radius:50%;background:#777}.nene-live-dot.online{background:#55d88a}
</style>
<script id="nene-backend-bridge-js">
window.NENE_BACKEND_URL=localStorage.getItem('nene_backend_url')||'';
window.NENEBackend={
 setUrl:function(url){window.NENE_BACKEND_URL=(url||'').trim(); if(window.NENE_BACKEND_URL)localStorage.setItem('nene_backend_url',window.NENE_BACKEND_URL);},
 getUrl:function(){return window.NENE_BACKEND_URL;},
 authHeaders:async function(headers){const output=Object.assign({},headers||{});if(window.neneAuthGetAccessToken){const token=await window.neneAuthGetAccessToken();if(token)output.Authorization='Bearer '+token;}return output;},
 health:async function(){
   if(!window.NENE_BACKEND_URL)return {connected:false};
   try{const r=await fetch(window.NENE_BACKEND_URL.replace(/\/$/,'')+'/api/health');return {connected:r.ok,data:await r.json()};}
   catch(e){return {connected:false};}
 },
 generate:async function(payload,idempotencyKey){
   if(!window.NENE_BACKEND_URL)throw new Error('Backend is not connected yet');
   let headers={'Content-Type':'application/json'};
   if(idempotencyKey)headers['Idempotency-Key']=idempotencyKey;
   headers=await this.authHeaders(headers);
   const r=await fetch(window.NENE_BACKEND_URL.replace(/\/$/,'')+'/api/generate',{method:'POST',headers,body:JSON.stringify(payload)});
   if(!r.ok)throw new Error(await r.text()||'Generation request failed');
   return await r.json();
 },
 job:async function(jobId,mode,provider){
   if(!window.NENE_BACKEND_URL)throw new Error('Backend is not connected yet');
   let url=window.NENE_BACKEND_URL.replace(/\/$/,'')+'/api/jobs/'+encodeURIComponent(jobId)+'?mode='+(mode||'text-to-video');
   if(provider)url+='&provider='+encodeURIComponent(provider);
   const r=await fetch(url,{headers:await this.authHeaders()});
   if(!r.ok)throw new Error(await r.text()||'Job status request failed');
   return await r.json();
 },
 waitForJob:async function(jobId,mode,provider,onUpdate,maxWaitMs=900000,intervalMs=7000){
   const started=Date.now();
   for(;;){
     const data=await this.job(jobId,mode,provider);
     if(typeof onUpdate==='function')onUpdate(data);
     const status=String(data?.status||'').toLowerCase();
     if(['complete','completed','failed','error','cancelled','canceled'].includes(status))return data;
     if(Date.now()-started>=maxWaitMs){
       const e = new Error('Video generation is still processing. The job has been saved; please wait before starting another generation.');
        e.code = 'NENE_JOB_PENDING';
        throw e;
     }
     await new Promise(r=>setTimeout(r,intervalMs));
   }
 }
};
</script>

async function neneReadImageData(file){
  if(!file) throw new Error('Could not read the selected image.');
  const objectUrl=URL.createObjectURL(file);
  try{
    // Use the browser's own image decoder first. This works with images the
    // phone gallery can display even when the file MIME type is unusual.
    const img=await new Promise((resolve,reject)=>{
      const el=new Image();
      el.onload=()=>resolve(el);
      el.onerror=()=>reject(new Error('Image format could not be decoded by this browser.'));
      el.src=objectUrl;
    });

    const sourceW=img.naturalWidth||img.width||0;
    const sourceH=img.naturalHeight||img.height||0;
    if(!sourceW||!sourceH) throw new Error('Image has no readable dimensions.');

    // Normalize every supported/decodable phone image to a compact JPEG so
    // the backend and Pixazo receive one predictable format.
    const maxSide=2048;
    const scale=Math.min(1,maxSide/Math.max(sourceW,sourceH));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(sourceW*scale));
    canvas.height=Math.max(1,Math.round(sourceH*scale));
    const ctx=canvas.getContext('2d',{alpha:false});
    if(!ctx) throw new Error('Could not prepare the selected image.');
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);

    // Avoid FileReader here: some mobile browser/file-picker combinations
    // can fail while reading a Blob even though the image itself is readable.
    // Canvas.toDataURL produces the exact data URI the backend accepts.
    const dataUri=canvas.toDataURL('image/jpeg',0.9);
    if(!dataUri || !dataUri.startsWith('data:image/jpeg;base64,')){
      throw new Error('Could not convert the selected image.');
    }
    return dataUri;
  }catch(e){
    throw new Error(e && e.message ? e.message : 'Could not read the selected image.');
  }finally{
    URL.revokeObjectURL(objectUrl);
  }
}

function neneCreationName(prompt,label){
  const words=String(prompt||'').replace(/[^a-zA-Z0-9À-ÿ\s-]/g,' ').trim().split(/\s+/).filter(Boolean).slice(0,7);
  const short=words.join(' ');
  return (short ? short : label)+' · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

window.generate = async function generate(type) {
 if(type==='text'||type==='image'){if(window.neneOpenVideoStudio)return window.neneOpenVideoStudio(type);toast('Video Studio could not load. Refresh the app.');return;}
  if(type==='social'){if(window.neneOpenSocialContent)return window.neneOpenSocialContent();toast('Social Content could not load. Refresh the app.');return;}
  const promptEl = document.getElementById('nenePrompt') || document.getElementById('prompt') || document.querySelector('textarea');
  let prompt = promptEl ? promptEl.value.trim() : '';
  if (!prompt) {
    alert(type === 'image' ? 'Please describe the motion you want first.' : 'Please enter a prompt first.');
    return;
  }
  if(type === 'text'){
    const style=document.getElementById('neneStyle')?.value || 'Cinematic';
    const shot=document.getElementById('neneShot')?.value || 'Medium shot';
    const camera=document.getElementById('neneCamera')?.value || 'Smooth cinematic camera';
    const lighting=document.getElementById('neneLighting')?.value || 'Natural cinematic lighting';
    const motion=document.getElementById('neneMotion')?.value || 'Natural, realistic movement';
    prompt += ` Style: ${style}. Shot: ${shot}. Camera: ${camera}. Lighting: ${lighting}. Motion: ${motion}. Maintain realistic anatomy, coherent objects and consistent visual details throughout the shot.`;
    if(window.NENEPromptAssist){const prepared=window.NENEPromptAssist.forGeneration(promptEl,prompt);if(prepared===null)return;prompt=prepared;}
  } else if(type === 'image'){
    const motion=document.getElementById('neneImageMotion')?.value || 'Natural, realistic movement';
    const camera=document.getElementById('neneImageCamera')?.value || 'Smooth cinematic camera';
    const style=document.getElementById('neneImageStyle')?.value || 'Photorealistic';
    const lighting=document.getElementById('neneImageLighting')?.value || 'Natural cinematic lighting';
    prompt += ` Style: ${style}. Camera: ${camera}. Lighting: ${lighting}. Motion: ${motion}. Preserve the exact subject identity, face, hair, clothing, colors, body proportions and important visual details from the source image. Do not change the person or turn them into a different person. Keep motion natural and temporally consistent.`;
  }

  // Commercial pricing is calculated by NENE's backend from the selected provider,
  // model, resolution and duration. Never trust a browser-side fixed generation price.
  let cost = 0;

  if (type !== 'text' && type !== 'image') {
    if (typeof credits !== 'undefined') {
      credits -= cost;
      neneCreditsCharged = true;
    }
    if (typeof updateCredits === 'function') updateCredits();
    alert('This workflow is still in prototype mode. Text → Video and Image → Video are the first real engines connected.');
    return;
  }

  const backendUrl = window.NENEBackend && window.NENEBackend.getUrl
    ? window.NENEBackend.getUrl()
    : '';
  if (!backendUrl) {
    alert('Connect the NENE AI backend first.');
    return;
  }

  const durationEl = document.getElementById('neneDuration');
  const resolutionEl = document.getElementById('neneResolution');
  const requestedDuration = Number(durationEl ? durationEl.value : 10);
  let resolution = resolutionEl ? resolutionEl.value : '1920x1080';

  // LTX-2.5 Fast supports 6/8/10 seconds at 4K and 6–20 seconds at 720p/1080p.
  let duration = requestedDuration;
  if (resolution === '3840x2160') duration = requestedDuration <= 6 ? 6 : 10;
  else if (requestedDuration === 5) duration = 6;
  else if (requestedDuration === 15) duration = 16;
  else if (requestedDuration >= 30) duration = 20;

  let imageUri = null;

  let neneCreditsCharged = false;
  const button = document.getElementById('neneGenerateBtn');
  if (!button) {
    throw new Error('NENE AI could not find the Generate button. Please reopen this creation screen.');
  }
  const oldText = button.innerHTML;
  if (button) {
    button.disabled = true;
    button.innerHTML = type === 'image' ? '⏳ Uploading image…' : '⏳ Generating…';
  }

  try {
    if (type === 'image') {
      const input = document.getElementById('fileInput');
      const file = (window.neneSelectedImages && window.neneSelectedImages[0]) || (input && input.files && input.files[0]);
      if (!file) throw new Error('Please upload an image first.');
      if (file.size > 15 * 1024 * 1024) {
        throw new Error('Please choose an image under 15 MB.');
      }
      // Do not reject phone/gallery formats here. We normalize the selected image
      // to JPEG in neneReadImageData before sending it to the backend.
      const dataUri = window.neneSelectedImageDataUri || (window.neneSelectedImageDataUriPromise ? await window.neneSelectedImageDataUriPromise : await neneReadImageData(file));
      if (button) button.innerHTML = '☁️ Uploading image…';
      const uploadResp = await fetch(backendUrl.replace(/\/$/,'') + '/api/image-upload', {method:'POST',headers:await window.NENEBackend.authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({data_uri:dataUri})});
      if (!uploadResp.ok) throw new Error(await uploadResp.text() || 'Image upload failed.');
      const uploadData = await uploadResp.json();
      imageUri = uploadData.image_url;
      if (!imageUri) throw new Error('Backend did not return a public image URL.');
    }

    if (button) button.innerHTML = '⏳ Sending to NENE AI…';
    const providerEl = document.getElementById('neneProvider');
    const provider = providerEl ? providerEl.value : 'auto';
    syncVideoProviderOptions();
    const effectiveResolutionEl = document.getElementById('neneResolution');
    if(provider === 'magic-hour'){
      if(resolution === '1920x1080') resolution = '1080p';
      else if(resolution === '1280x720') resolution = '720p';
      else if(resolution === '3840x2160') resolution = '1080p';
    }
    // Ask the backend for the current provider cost and NENE margin quote.
    // Auto reserves against the first configured provider in the backend's routing
    // order; if Auto later falls back, the backend can safely settle the actual cost.
    let quoteProvider = provider;
    let quoteModel = provider === 'magic-hour' ? 'ltx-2.5' : 'ltx-2-5-fast';
    if(provider === 'auto'){
      const infoResp = await fetch(backendUrl.replace(/\/$/,'') + '/api/provider-info', {cache:'no-store'});
      if(!infoResp.ok) throw new Error('NENE AI pricing could not verify the available provider.');
      const info = await infoResp.json();
      quoteProvider = (info.selection_order || ['pixazo','magic-hour','ltx']).find(p => info.providers?.[p]?.configured);
      if(!quoteProvider) throw new Error('NENE AI has no configured video provider available.');
      quoteModel = quoteProvider === 'magic-hour' ? 'ltx-2.5' : 'ltx-2-5-fast';
    } else if(provider === 'pixazo'){
      // The connected Pixazo endpoint is LTX Video 2.5; its current public rate
      // is $0.45 for a 5-second 1280×704 clip, i.e. $0.09/sec after free balance.
      quoteModel = 'ltx-2-5-lite';
    }

    const quoteResp = await fetch(backendUrl.replace(/\/$/,'') + '/api/pricing/quote', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      cache:'no-store',
      body:JSON.stringify({provider:quoteProvider, model:quoteModel, resolution, duration})
    });
    if(!quoteResp.ok) throw new Error('NENE AI pricing is temporarily unavailable. Please try again in a moment.');
    const quote = await quoteResp.json();
    cost = Number(quote.recommended_credits);
    if(!Number.isFinite(cost) || cost < 0) throw new Error('NENE AI returned an invalid generation price.');
    if (typeof credits !== 'undefined' && credits < cost) {
      alert('Not enough NENE credits. This generation requires ' + cost + ' credits.');
      return;
    }
    if (typeof credits !== 'undefined') credits -= cost;
    if (typeof updateCredits === 'function') updateCredits();
    const payload = {
      type: type === 'image' ? 'image-to-video' : 'text-to-video',
      prompt,
      // Auto may fall back to Magic Hour, so use a model ID that both the
      // router and Magic Hour can normalize safely.
      model: provider === 'magic-hour' || provider === 'auto' ? 'ltx-2.5' : 'ltx-2-5-fast',
      resolution,
      duration,
      provider
    };
    if (imageUri) payload.image_uri = imageUri;

    const idempotencyKey = (window.crypto && typeof window.crypto.randomUUID === 'function')
      ? window.crypto.randomUUID()
      : 'nene_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
    try { localStorage.setItem('nene_generation_idempotency', idempotencyKey); } catch (_) {}
    const response = await window.NENEBackend.generate(payload, idempotencyKey);
    const jobId = response && (response.job_id || response.id || response.jobId);
    if (!jobId) throw new Error('The backend did not return a generation job ID.');
    const activeProvider = String(response?.provider || provider || 'auto').toLowerCase();
    const mode = type === 'image' ? 'image-to-video' : 'text-to-video';
    recordNeneJob({id:jobId,status:'QUEUED',type:type==='image'?'Image → Video':'Text → Video',mode,provider:activeProvider,prompt,duration,resolution,cost,creditCharged:neneCreditsCharged});
    try {
      localStorage.setItem('nene_pending_job', JSON.stringify({
        jobId, mode, type, prompt, provider: activeProvider, idempotencyKey, createdAt: new Date().toISOString()
      }));
    } catch (_) {}
    const final = await window.NENEBackend.waitForJob(
      jobId, mode, activeProvider,
      function(job){
        const s = String(job?.status || '').toUpperCase();
        if (button) {
          if (s === 'QUEUED') button.innerHTML = '⏳ Queued…';
          else if (s === 'PROCESSING') button.innerHTML = '🎬 Generating…';
          else if (s) button.innerHTML = '⏳ ' + s + '…';
        }
      },
      900000, 7000
    );
    const finalStatus = String(final?.status || '').toLowerCase();
    if (['failed','error','cancelled','canceled'].includes(finalStatus)) {
      const detail = final?.error?.message || final?.error || final?.message || 'Video generation failed.';
      throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
    }
    const videoUrl =
      final?.video_url ||
      final?._nene_video_url ||
      final?.result?.video_url ||
      final?.output?.video_url ||
      final?.output?.media_url?.[0] ||
      final?.result?.media_url?.[0] ||
      final?.downloads?.[0]?.url ||
      final?.result?.downloads?.[0]?.url ||
      final?.result?.url ||
      final?.url;
    if (!videoUrl) throw new Error('Generation finished, but no video URL was returned.');
    try {
      localStorage.removeItem('nene_pending_job');
      localStorage.removeItem('nene_generation_idempotency');
    } catch (_) {}
    updateNeneJob(jobId,{status:'COMPLETED',videoUrl});

    const container =
      document.getElementById('neneGenerationResult') ||
      document.querySelector('.result, .generation-result, [data-result]');
    const label = type === 'image' ? 'Image → Video' : 'Text → Video';
    const html = `
      <div style="margin-top:18px;padding:16px;border:1px solid rgba(212,175,55,.45);border-radius:16px;background:rgba(255,255,255,.04)">
        <h3 style="margin:0 0 10px">🎬 ${label} ready</h3>
        <video controls playsinline style="width:100%;max-width:900px;border-radius:12px" src="${videoUrl}"></video>
        <p style="margin:10px 0 0"><a href="${videoUrl}" target="_blank" rel="noopener">Open video</a></p>
      </div>`;
    if (container) {
      container.innerHTML = html;
      container.style.display = '';
    } else {
      const section = document.querySelector('main') || document.body;
      section.insertAdjacentHTML('beforeend', html);
    }

    if (typeof creations !== 'undefined') {
      creations.unshift({
        jobId,
        name: neneCreationName(prompt, label),
        type: label,
        prompt,
        videoUrl,
        provider: activeProvider,
        duration,
        resolution,
        icon: type === 'image' ? '🖼️' : '🎬',
        createdAt: new Date().toISOString()
      });
      if (typeof saveState === 'function') saveState();
      setTimeout(()=>{ if(typeof renderCreations==='function') renderCreations(); },50);
    }
  } catch (err) {
    try {
      const pending = JSON.parse(localStorage.getItem('nene_pending_job') || 'null');
      if (pending && pending.jobId) {
        const msg = String(err?.message || err);
        if (/failed|error|cancelled|canceled/i.test(msg)) localStorage.removeItem('nene_pending_job');
      }
    } catch (_) {}
    const pendingStillActive = err && err.code === 'NENE_JOB_PENDING';
    if (typeof jobId !== 'undefined' && jobId) updateNeneJob(jobId,{status:pendingStillActive?'PROCESSING':'FAILED',error:pendingStillActive?null:(err?.message||String(err))});
    // Refund only when NENE AI actually charged this generation attempt.
    // Provider-side rejections (for example insufficient Magic Hour credits)
    // must never consume the user's NENE AI credits.
    if (!pendingStillActive && neneCreditsCharged) {
      if (typeof credits !== 'undefined') credits = Math.min(1000, credits + cost);
      neneCreditsCharged = false;
      if (typeof updateCredits === 'function') updateCredits();
    }
    let userMessage = err?.message || String(err);
    try {
      const parsed = JSON.parse(userMessage);
      const detail = parsed?.detail;
      if (Array.isArray(detail) && detail[0]?.error) {
        const providerError = detail[0].error;
        if (providerError.code === 'card_required') {
          userMessage = 'Pixazo requires a payment card for this API account before it can use its Free Tier. NENE AI will not ask you to add a card. Choose Magic Hour for a no-card test, or add the card in Pixazo if you want to use Pixazo.';
        } else if (providerError.code === 'insufficient_credits') {
          userMessage = 'Magic Hour does not have enough provider credits for this generation. These are Magic Hour credits, not NENE AI credits. NENE AI has refunded this failed attempt, and no second provider will be charged automatically.';
        } else {
          userMessage = providerError.message || userMessage;
        }
      }
    } catch (_) {}
    alert((pendingStillActive ? 'Video is still processing: ' : 'Video generation failed: ') + userMessage);
  } finally {
    if (button) {
      button.disabled = false;
      button.innerHTML = oldText || '✨ Generate Video';
    }
  }
}

function syncVideoProviderOptions(){
  const providerEl=document.getElementById('neneProvider');
  const resolutionEl=document.getElementById('neneResolution');
  const noticeEl=document.getElementById('neneProviderNotice');
  if(!providerEl || !resolutionEl) return;
  const provider=providerEl.value;
  const current=resolutionEl.value;
  if(provider==='magic-hour'){
    const durationEl=document.getElementById('neneDuration');
    if(durationEl){
      const d=durationEl.value;
      durationEl.innerHTML='<option value="3">3 seconds (Free)</option><option value="5">5 seconds</option><option value="10">10 seconds</option><option value="15">15 seconds</option><option value="30">30 seconds</option>';
      durationEl.value=['3','5','10','15','30'].includes(d) ? d : '3';
    }
    resolutionEl.innerHTML='<option value="480p">480p (Free)</option><option value="720p">720p (Paid)</option><option value="1080p">1080p (Paid)</option>';
    if(current==='1920x1080') resolutionEl.value='1080p';
    if(current==='1280x720') resolutionEl.value='720p';
    if(!['480p','720p','1080p'].includes(resolutionEl.value)) resolutionEl.value='480p';
    if(noticeEl) noticeEl.innerHTML='⚠️ <b>Magic Hour:</b> free-tier exports may include Magic Hour branding/watermark. NENE AI cannot remove provider watermarks. Use an eligible paid Magic Hour plan for watermark-free output.';
  }else{
    const durationEl=document.getElementById('neneDuration');
    if(provider==='auto'){
      if(durationEl){
        const d=durationEl.value;
        durationEl.innerHTML='<option value="3">3 seconds (safe fallback)</option><option value="5">5 seconds</option><option value="10">10 seconds</option><option value="15">15 seconds</option><option value="30">30 seconds</option>';
        durationEl.value=['3','5','10','15','30'].includes(d) ? d : '3';
      }
      resolutionEl.innerHTML='<option value="480p">480p (safe fallback)</option><option value="1280x720">720p</option><option value="1920x1080">1080p HD</option><option value="3840x2160">4K (Pro)</option>';
      if(current==='480p') resolutionEl.value='480p';
      else if(current==='720p') resolutionEl.value='1280x720';
      else if(current==='1080p') resolutionEl.value='1920x1080';
      else if(['1920x1080','1280x720','3840x2160'].includes(current)) resolutionEl.value=current;
      else resolutionEl.value='480p';
    } else {
      resolutionEl.innerHTML='<option value="1920x1080">1080p HD</option><option value="1280x720">720p</option><option value="3840x2160">4K (Pro)</option>';
      if(current==='480p') resolutionEl.value='1280x720';
      else if(current==='720p') resolutionEl.value='1280x720';
      else if(current==='1080p') resolutionEl.value='1920x1080';
      else if(['1920x1080','1280x720','3840x2160'].includes(current)) resolutionEl.value=current;
      else resolutionEl.value='1920x1080';
    }
    if(noticeEl){
      if(provider==='pixazo') noticeEl.innerHTML='✅ <b>Pixazo:</b> NENE AI does not add a watermark. Provider terms and plan limits still apply.';
      else if(provider==='ltx') noticeEl.innerHTML='ℹ️ <b>LTX:</b> NENE AI does not add a watermark. Any provider branding depends on the LTX service/account being used.';
      else noticeEl.innerHTML='✨ <b>Auto:</b> NENE AI chooses the best configured provider. The 3-second/480p options are the safest fallback if Pixazo requires a card; Auto will not charge a second provider after an accepted job.';
    }
  }
}
