name: Frontend syntax checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/auth-signin-foundation"]

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate auth modules and inline application scripts
        run: node scripts/check_frontend_syntax.mjs

      - name: Install Director UI test dependency
        run: npm install --no-save --no-audit --no-fund jsdom@26.1.0
      - name: Verify Director interactions and error handling
        run: node scripts/check_director.cjs

      - name: Verify paid wallet and refund policy
        run: node scripts/check_paid_access.cjs

      - name: Verify one-time account agreement
        run: node scripts/check_account_setup.cjs

      - name: Verify paid advertisement workflow
        run: node scripts/check_ad_studio.cjs

      - name: Verify fullscreen layout and Studio paging
        run: node scripts/check_layout.cjs
