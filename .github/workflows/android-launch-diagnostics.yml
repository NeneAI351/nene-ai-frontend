name: Android launch diagnostics
on:
  push:
    branches: [build/android-launch-diagnostics]
permissions:
  contents: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build both launcher variants
        working-directory: android
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          manifest=app/src/main/AndroidManifest.xml
          cp "$manifest" /tmp/nene-manifest-fixed.xml
          git show 46644536c2aa60ccbcf8f18a0ace0e376b2c67e5:android/app/src/main/AndroidManifest.xml > "$manifest"
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/nene-original.apk
          cp /tmp/nene-manifest-fixed.xml "$manifest"
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/nene-fixed.apk
      - name: Compare Android 14 launcher behavior
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install /tmp/nene-original.apk
            adb logcat -c
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.neneai.app.internal/com.google.androidbrowserhelper.trusted.LauncherActivity
            sleep 5
            adb logcat -d -b crash | tee /tmp/nene-original-crash.txt
            adb uninstall com.neneai.app.internal
            adb install /tmp/nene-fixed.apk
            adb logcat -c
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.neneai.app.internal/com.google.androidbrowserhelper.trusted.LauncherActivity
            sleep 5
            adb logcat -d -b crash | tee /tmp/nene-fixed-crash.txt
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity'
            ! grep -F 'Process: com.neneai.app.internal,' /tmp/nene-fixed-crash.txt
