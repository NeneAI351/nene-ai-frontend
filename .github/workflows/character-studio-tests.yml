name: Character Studio checks
on: [push, pull_request]
jobs:
  character-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix tests --ignore-scripts --no-audit --no-fund
      - run: node --check characters.js
      - run: node --check script-writer.js
      - run: node --test tests/character-studio.test.cjs tests/script-writer.test.cjs

      - run: NODE_PATH=tests/node_modules node scripts/check_social_content.cjs

      - run: node --test tests/prompt-assist.test.cjs

      - run: node --test tests/video-studio.test.cjs


      - run: node --test tests/story-studio.test.cjs
